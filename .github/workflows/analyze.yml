name: Analisa capítulos da tese

on:
  # Só execução manual. O repositório da tese ficou privado depois da entrega,
  # e a regeneração automática (dispatch, agendamento e push) foi desligada;
  # para rodar de novo, é preciso dar a este workflow um token com acesso de
  # leitura à tese (ver docs/SETUP.md).
  workflow_dispatch:
    inputs:
      only:
        description: "Slugs separados por vírgula (vazio = todos os habilitados)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"   # regeneração determinística: o agendamento só commita se a tese mudou
    steps:
      - name: Checkout tecno-etnografia-tese-site
        uses: actions/checkout@v4
        with:
          path: c4ai

      - name: Checkout tecno-etnografia-centro-ia (.tex)
        uses: actions/checkout@v4
        with:
          repository: julianehelanski/tecno-etnografia-centro-ia
          # Se o repo .tex for privado, defina o secret ETNOGRAFIA_PAT como um
          # Personal Access Token com escopo `repo` (fine-grained: read contents
          # do repositório tecno-etnografia-centro-ia). Se for público (é o caso
          # atual), o GITHUB_TOKEN padrão já funciona.
          token: ${{ secrets.ETNOGRAFIA_PAT || secrets.GITHUB_TOKEN }}
          path: c4ai/_tex
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        working-directory: c4ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        working-directory: c4ai
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then
            python rede_textual/run_all.py --source-root _tex --only "$ONLY"
          else
            python rede_textual/run_all.py --source-root _tex
          fi

      - name: Regenera a rede textual da tese e reinjeta no index.html (mapa principal)
        working-directory: c4ai
        run: python rede_textual/tese_network.py --source-root _tex --inject index.html

      - name: Regenera as redes por capítulo (Louvain próprio de cada um) e reinjeta no index.html
        working-directory: c4ai
        run: python rede_textual/tese_network_chapters.py --source-root _tex --inject index.html

      - name: Sincroniza imagens da análise para o site (figuras/)
        working-directory: c4ai
        run: python rede_textual/sync_site_figuras.py

      - name: Sincroniza figuras de conteúdo da tese para o site (mapa)
        working-directory: c4ai
        run: python scripts/sync_tese_figuras.py --source-root _tex

      - name: Relatório de divergência tese ↔ site (seções/figuras)
        working-directory: c4ai
        run: python scripts/relatorio_divergencia_tese.py --source-root _tex

      - name: Regenera o documento da tese (resumo · sumário · figuras · tabelas) e reinjeta no index.html
        working-directory: c4ai
        run: python rede_textual/tese_documento.py --source-root _tex --inject index.html

      # Otimização WebP: depois de toda sincronização/injeção de figuras e
      # ANTES do cache-busting. Gera um .webp otimizado ao lado de cada PNG/JPG
      # em figuras/ e reescreve as referências do index.html de .png/.jpg para
      # .webp (as PNGs originais permanecem no repositório). Idempotente: mesmo
      # que a injeção volte a escrever .png a cada rodada, este passo reconverte.
      - name: Otimiza figuras para WebP e reaponta o index.html
        working-directory: c4ai
        run: python scripts/otimizar_figuras.py

      # Cache-busting POR ÚLTIMO, depois de toda regeneração/sincronização/
      # injeção de figuras e de qualquer reescrita do index. Garante que o ?v=
      # bate com os bytes reais das figuras e o GitHub Pages baixa as versões
      # novas, sem ajuste manual.
      - name: Cache-busting das figuras (index.html)
        working-directory: c4ai
        run: SITE_INDEX=index.html python scripts/cache_busting_figuras.py

      - name: Commit & push outputs
        working-directory: c4ai
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rede_textual/ figuras/ index.html docs/divergencia-tese.md scripts/tex_structure_snapshot.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos outputs da análise."
            exit 0
          fi
          SOURCE_SHA="${{ github.event.client_payload.sha || 'manual' }}"
          git commit -m "Regenerate networks + site figures/keywords from thesis@${SOURCE_SHA:0:7}"
          # Push com integração do remoto: se o main avançou (ex.: runs
          # concorrentes disparados pela tese), o push é rejeitado com
          # "fetch first". Antes de repetir, integramos o main remoto via
          # rebase — a regeneração é determinística (PYTHONHASHSEED=0), então
          # o rebase tende a aplicar limpo. Backoff exponencial (2s…32s).
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejeitado (tentativa $i): integrando main remoto via rebase…"
            if ! git pull --rebase origin main; then
              echo "Conflito no rebase — abortando; o main remoto já tem outputs mais recentes."
              git rebase --abort || true
              exit 1
            fi
            sleep $((2 ** i))
          done
          exit 1
